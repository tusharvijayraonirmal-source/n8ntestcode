name: "AI PR Code Review - main-pr"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-code-review:
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure review scripts are up to date
        shell: bash
        run: |
          set -e

          git fetch origin main

          for script in scripts/ai_code_review.py scripts/claude_api.py scripts/publish_review.py scripts/send_review_email.py; do

            if git show "origin/main:$script" > "$script" 2>/dev/null; then
              echo "Synced $script from origin/main"
            else
              echo "WARNING: $script not found on origin/main, keeping checked-out copy"
            fi

          done

      - name: Get PR information
        shell: bash
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          echo "BASE_BRANCH=main" >> "$GITHUB_ENV"
          echo "HEAD_BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"

      - name: Setup Python virtual environment
        shell: bash
        run: |
          set -e

          python3 -m venv .venv

          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          .venv/bin/python -m pip install -r requirements.txt

      - name: Generate PR diff
        shell: bash
        run: |
          set -e

          git fetch origin "$BASE_BRANCH"

          git diff             "origin/$BASE_BRANCH...HEAD"             > pr_diff.txt

          if [ ! -s pr_diff.txt ]; then
            echo "No changes found in pull request"
            exit 0
          fi

          echo "PR diff generated"
          wc -l pr_diff.txt

      - name: Validate Claude configuration
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          set -e

          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ERROR: ANTHROPIC_AUTH_TOKEN is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "ERROR: ANTHROPIC_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_MODEL" ]; then
            echo "ERROR: ANTHROPIC_MODEL is missing"
            exit 1
          fi

          echo "Claude configuration is valid"
          echo "Claude base URL: $ANTHROPIC_BASE_URL"
          echo "Claude model: $ANTHROPIC_MODEL"

      - name: Run PR AI code review
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REVIEW_MODE: PR
          REVIEW_SKILLS: "code-review,security-review"
          CLAUDE_MODEL: "claude-sonnet-5"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_BRANCH: main
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          set -e

          echo "Starting PR AI code review"
          echo "======================================"
          echo "Starting PR AI code review"
          echo "======================================"

          echo "Execution ID: $EXECUTION_ID"
          echo "Repository: $REPOSITORY"
          echo "Review mode: $REVIEW_MODE"
          echo "Review branch: $REVIEW_BRANCH"
          echo "Claude model: $CLAUDE_MODEL"

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/ai_code_review.py"             --diff "$GITHUB_WORKSPACE/pr_diff.txt"             --pr-number "$PR_NUMBER"             --repository "$REPOSITORY"             --review-mode "$REVIEW_MODE"             --skills "$REVIEW_SKILLS"             --repository-context "$REVIEW_BRANCH"
            --execution-id "$EXECUTION_ID"

      - name: Validate review result
        shell: bash
        run: |
          set -e

          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is empty"
            exit 1
          fi

          if ! .venv/bin/python             -m json.tool             review_result.json             > /dev/null 2>&1; then
            echo "ERROR: review_result.json contains invalid JSON"
            exit 1
          fi

          echo "Review result is valid"

      - name: Notify backend
        if: always()
        shell: bash
        env:
          BACKEND_URL: ${{vars.BACKEND_URL}}
          INSTANCE_NAME: ${{vars.REVIEW_INSTANCE_NAME}}
          INTERNAL_API_TOKEN: ${{secrets.INTERNAL_API_TOKEN}}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Shell parameter-expansion delimiters are doubled because this block
          # is embedded in a Python f-string and must be escaped.
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::warning::BACKEND_URL is not configured, skipping"
            exit 0
          fi

          if [ -z "${INTERNAL_API_TOKEN:-}" ]; then
            echo "::warning::INTERNAL_API_TOKEN is not configured, skipping"
            exit 0
          fi

          echo "Backend URL: $BACKEND_URL"
          echo "Repository: $REPOSITORY_NAME"
          echo "Instance name: ${INSTANCE_NAME:-not set}"

          # Verify backend connectivity (non-fatal)
          echo "Checking backend connectivity..."
          if ! curl -fsS --max-time 15 "$BACKEND_URL/openapi.json" -o /dev/null; then
            echo "::warning::Backend unreachable at $BACKEND_URL, skipping"
            exit 0
          fi

          # The backend expects the query parameter name `repository`.
          echo "Looking up repository instance..."

          RESPONSE=""
          if ! RESPONSE=$(curl -fsS --max-time 20             --get             --data-urlencode "repository=$REPOSITORY_NAME"             "$BACKEND_URL/api/instances"             -H "Authorization: Bearer $INTERNAL_API_TOKEN"); then
            echo "::warning::Instance lookup failed, skipping"
            exit 0
          fi

          # Match on repository_name so the correct instance is used when a
          # repository has more than one configured.
          INSTANCE_ID=$(RESPONSE="$RESPONSE" REPO="$REPOSITORY_NAME" python3 -c '
          import json
          import os
          import sys

          data = json.loads(os.environ["RESPONSE"])
          repo = os.environ["REPO"]

          if isinstance(data, dict):
              items = data.get("instances", [data])
          elif isinstance(data, list):
              items = data
          else:
              sys.exit("Unexpected response from instance API")

          match = next(
              (
                  item for item in items
                  if isinstance(item, dict)
                  and item.get("repository_name") == repo
                  and item.get("id") is not None
              ),
              None,
          )

          if match is None:
              sys.exit("No instance found for repository: " + repo)

          print(match["id"])
          ')

          echo "Found instance ID: $INSTANCE_ID"

          if [ ! -s review_result.json ]; then
            echo "::error::review_result.json is missing or empty"
            exit 1
          fi

          # Write the payload to a file rather than inlining the token in a
          # shell-quoted Python string.
          python3 -c '
          import json
          import os

          with open("review_result.json", encoding="utf-8") as f:
              review = json.load(f)

          with open("callback_payload.json", "w", encoding="utf-8") as f:
              json.dump(dict(
                  token=os.environ["INTERNAL_API_TOKEN"],
                  review=review,
              ), f)
          '

          echo "Sending review result..."
          curl -fsS --max-time 30             -X POST             "$BACKEND_URL/api/ephemeral-runner/$INSTANCE_ID/complete"             -H "Content-Type: application/json"             --data-binary @callback_payload.json             || echo "::warning::Failed to send review result to backend"

      - name: Publish AI Review
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s review_result.json ]; then
            echo "No review result found"
            exit 0
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/publish_review.py"             --pr-number "$PR_NUMBER"             --review-file review_result.json

      - name: Send reviewer notification
        if: ${{ always() && vars.REVIEWER_EMAIL != '' }}
        shell: bash
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}
        run: |
          if [ ! -s review_result.json ]; then
            echo "No review result found; skipping email"
            exit 0
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/send_review_email.py"             --review-file review_result.json             --pr-number "$PR_NUMBER"             --repository "$REPOSITORY"
